services:
  movies-service:
    build:
      context: .
      dockerfile: movies-service/Dockerfile
    expose:
      - "50051"

  reviews-service:
    build:
      context: .
      dockerfile: reviews-service/Dockerfile
    expose:
      - "50052"

  gateway:
    build:
      context: .
      dockerfile: gateway/Dockerfile
    ports:
      - "8000:8000"
    environment:
      MOVIES_SERVICE_ADDR: movies-service:50051
      REVIEWS_SERVICE_ADDR: reviews-service:50052
    depends_on:
      - movies-service
      - reviews-service
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request; urllib.request.urlopen('http://localhost:8000/health')\""]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
      args:
        # O browser fala com o gateway publicado no host (localhost:8000).
        VITE_API_URL: http://localhost:8000
    ports:
      - "3000:80"
    depends_on:
      - gateway
